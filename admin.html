<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang quản trị tư vấn - THPT Mộ Đức</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #3D405B; border-bottom: 2px solid #E07A5F; padding-bottom: 10px; }
        .chat-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .student-msg { font-size: 1rem; color: #2b2d42; margin-bottom: 10px; }
        .teacher-reply { background: #e8f5e9; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; color: #2e7d32; margin-top: 8px; }
        .reply-box { display: flex; gap: 10px; margin-top: 10px; }
        .reply-box input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .reply-box button { background: #3D405B; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .reply-box button:hover { background: #E07A5F; }
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; color: white; display: inline-block; margin-bottom: 8px; }
        .bg-pending { background: #e67e22; }
        .bg-done { background: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h2>Hệ thống tiếp nhận & Trả lời tư vấn học đường</h2>
    <div id="message-list">Đang tải danh sách câu hỏi...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_kb029r3o2CG4NTtEtUitlFay@NE7b1E",
      authDomain: "chammoduc.firebaseapp.com",
      projectId: "chammoduc",
      storageBucket: "chammoduc.firebasestorage.app",
      messagingSenderId: "255177066276",
      appId: "1:255177066276:web:bcefd1a2c161f9e8ab95b1",
      measurementId: "G-D3681Y2KSW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messengerRef = collection(db, "Messenger");

    // Tải và hiển thị danh sách tin nhắn học sinh gửi tới
    const q = query(messengerRef, orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
        const listDiv = document.getElementById("message-list");
        listDiv.innerHTML = "";

        if (snapshot.empty) {
            listDiv.innerHTML = "<p>Chưa có câu hỏi nào từ học sinh.</p>";
            return;
        }

        snapshot.forEach((documentSnap) => {
            const data = documentSnap.data();
            const id = documentSnap.id;
            const isDone = data.trangThai === "da_tra_loi";

            let html = `
                <div class="chat-card">
                    <span class="status-badge ${isDone ? 'bg-done' : 'bg-pending'}">
                        ${isDone ? 'Đã phản hồi' : 'Chờ phản hồi'}
                    </span>
                    <div class="student-msg"><b>Học sinh:</b> ${data.noiDung || ''}</div>
            `;

            if (data.traLoiGV) {
                html += `<div class="teacher-reply"><b>Câu trả lời hiện tại:</b> ${data.traLoiGV}</div>`;
            }

            html += `
                <div class="reply-box">
                    <input type="text" id="input-${id}" placeholder="Nhập câu trả lời của thầy/cô..." value="${data.traLoiGV || ''}">
                    <button onclick="phanHoi('https://thptmoduc-default-rtdb.firebaseio.com/', '${id}')">Gửi trả lời</button>
                </div>
            </div>`;

            listDiv.innerHTML += html;
        });
    });

    // Hàm để Giáo viên trả lời trực tiếp
    window.phanHoi = async function(dummy, docId) {
        const inputVal = document.getElementById(`input-${docId}`).value.trim();
        if (!inputVal) {
            alert("Vui lòng nhập nội dung trả lời!");
            return;
        }

        try {
            const docRef = doc(db, "Messenger", docId);
            await updateDoc(docRef, {
                traLoiGV: inputVal,
                trangThai: "da_tra_loi"
            });
            alert("Đã gửi phản hồi tới học sinh!");
        } catch (e) {
            console.error("Lỗi khi trả lời: ", e);
            alert("Không thể gửi phản hồi, vui lòng thử lại!");
        }
    };
</script>

</body>
</html>
