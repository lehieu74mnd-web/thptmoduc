<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chạm – Tư vấn học đường THPT Mộ Đức</title>
<meta name="theme-color" content="#3D405B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chạm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;--bg:#faf7ee;--card:#fff;--tx:#2b2d42;--mu:#6b6f85;--nv:#3D405B;--co:#E07A5F;--sg:#81B29A;--cr:#F4F1DE;--ye:#F2CC8F;--bd:#e6e1cf;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d2b;--card:#262942;--tx:#eceaf4;--mu:#a5a8c0;--nv:#a9b0e8;--cr:#33365a;--bd:#3a3e63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d2b;--card:#262942;--tx:#eceaf4;--mu:#a5a8c0;--nv:#a9b0e8;--cr:#33365a;--bd:#3a3e63;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:150px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#3D405B,#5a5f8a);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
header b{font-size:1.05rem}header small{display:block;opacity:.8;font-size:.78rem}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(61,64,91,.06)}
.card h2,.card h3{margin:0 0 6px;color:var(--nv)}.mu{color:var(--mu);font-size:.9rem}
.hero{background:linear-gradient(135deg,#3D405B,#E07A5F);color:#fff;border:0}.hero h2{color:#fff;font-size:1.35rem}.hero p{margin:6px 0 0;opacity:.95}
.btn{display:inline-block;background:var(--co);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.g{background:var(--cr);color:var(--nv)}.btn.n{background:var(--nv);color:#fff}.btn.s{background:var(--sg);color:#16352a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.two .btn{padding:18px 8px;text-align:center;font-size:1rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
input,select,textarea{width:100%;padding:11px;margin:3px 0 10px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.lb{font-size:.85rem;font-weight:600;color:var(--mu)}
.ok{background:var(--cr);color:var(--tx);border-left:4px solid var(--co);padding:10px 12px;border-radius:10px;margin:8px 0}
.post{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}.post p{white-space:pre-wrap;margin:4px 0}
.vid{border:0;border-radius:14px;max-width:100%}.tk{width:325px;height:580px}.yt{width:100%;aspect-ratio:16/9}.emb{width:100%;height:560px;border:0;border-radius:12px}
.scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.scroll>*{flex:none}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.step{background:var(--cr);border-radius:12px;padding:10px;font-size:.9rem}.step b{display:block;color:var(--nv)}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.tut{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.av{width:54px;height:54px;border-radius:50%;background:var(--sg);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;object-fit:cover;flex:none}
.opt{display:flex;gap:4px;flex-wrap:wrap}.opt label{flex:1;min-width:64px;text-align:center;border:1.5px solid var(--bd);border-radius:10px;padding:6px 4px;font-size:.8rem;cursor:pointer}.opt input{width:auto;margin:0 3px 0 0}
.info{width:100%;border-radius:12px;margin-bottom:8px}
/* chat */
.chat{border:2px solid var(--nv);border-radius:16px;overflow:hidden;background:var(--card)}.ch{background:var(--nv);color:#fff;padding:12px 14px;font-weight:700;font-size:.92rem}.ch i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4CAF50;margin-right:6px}
#cb{height:280px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.bm{background:var(--cr);padding:9px 12px;border-radius:12px 12px 12px 2px;border-left:4px solid var(--co);max-width:90%;font-size:.9rem;align-self:flex-start}.um{background:var(--nv);color:#fff;padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:82%;font-size:.9rem;align-self:flex-end}
.co{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-top:1px solid var(--bd)}.co button{background:var(--card);color:var(--nv);border:1.5px solid var(--nv);border-radius:16px;padding:5px 10px;font-size:.78rem;font-weight:700;cursor:pointer}
.ci{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.ci input{margin:0;border-radius:18px}
/* nav */
nav{display:flex;gap:4px;margin:10px -6px 0;overflow-x:auto}
nav a{flex:1;min-width:62px;text-align:center;text-decoration:none;color:rgba(255,255,255,.85);font-size:.68rem;padding:4px 2px;border-radius:12px;white-space:nowrap}nav a span{display:block;font-size:1.25rem;line-height:1.2}nav a.on{color:var(--nv);font-weight:700;background:var(--cr)}
/* m5 */
.book{perspective:700px}.pg{background:var(--cr);border:2px solid var(--ye);border-radius:6px 16px 16px 6px;padding:26px 20px;min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;color:var(--nv);font-style:italic;transform-origin:left center}.pg.fl{animation:fl .6s}
@keyframes fl{from{transform:rotateY(-90deg);opacity:0}to{transform:none;opacity:1}}
#bz{position:relative;height:270px;background:linear-gradient(#e9f3ee,#fdf0e4);border-radius:14px;overflow:hidden}
.bb{position:absolute;width:calc(25% - 8px);aspect-ratio:1;border-radius:50%;border:0;font-size:.66rem;line-height:1.2;padding:4px;color:#2b2d42;cursor:pointer;animation:fb 3s ease-in-out infinite alternate;transition:transform .25s,opacity .25s}.bb.pop{transform:scale(1.6);opacity:0}
@keyframes fb{from{margin-top:0}to{margin-top:-12px}}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header><b id="ht">Chạm</b><small>Trường THPT Mộ Đức · Cùng bạn đi qua quãng đời học sinh thật tươi đẹp</small><nav id="nav"></nav></header>
<main id="app"></main>
<script src="config.js"></script>
<script>
const C=window.CFG||{},$=s=>document.querySelector(s),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=[],SC=null,ip=null;
const NAV=[['home','🏠','Trang chủ'],['m2','💬','Tư vấn'],['m3','🛡️','An toàn'],['m4','🧭','Trắc nghiệm'],['m5','🤝','Không một mình']];
const TT={home:'Trang chủ',m2:'Phòng Tư vấn trực tuyến',m3:'An toàn học đường',m4:'Trắc nghiệm tâm lý',m5:'Bạn không một mình',gv:'Quản trị'};
const route=()=>{const r=(location.hash||'#home').slice(1);return TT[r]?r:'home'};
/* ---------- dữ liệu Google Sheet ---------- */
function csv(t){const r=[];let w=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){w.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;w.push(f);r.push(w);w=[];f=''}else f+=c}if(f||w.length){w.push(f);r.push(w)}return r}
const pd=s=>{s=(s||'').trim();const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],m[2]-1,+m[1]).getTime();const t=Date.parse(s);return isNaN(t)?0:t};
let SS=[],SF=[];const mix=()=>{S=SF.concat(SS)};const parse=t=>{SS=csv(t).slice(1).filter(r=>r[0]&&r[1]).map((r,i)=>({sec:r[0].trim().toLowerCase(),title:r[1],body:r[2]||'',link:(r[3]||'').trim(),ts:pd(r[4]),i}));mix()};
async function loadFS(){try{const{fs,db}=await fb();let first=1;fs.onSnapshot(fs.query(fs.collection(db,'posts'),fs.orderBy('ts','desc'),fs.limit(200)),q=>{SF=q.docs.map((d,i)=>{const x=d.data();return{sec:String(x.sec||'').toLowerCase(),title:x.title||'',body:x.body||'',link:x.link||'',ts:x.ts&&x.ts.toDate?x.ts.toDate().getTime():Date.now(),i:1e6-i}});mix();if(first){first=0;if(route()!='gv'&&document.activeElement==document.body)render()}})}catch(x){}}
function load(){if(fbOn())loadFS();let c='';try{c=localStorage.getItem('cham2')||''}catch(x){}if(c){parse(c);render()}
 if(C.sheetCsv)fetch(C.sheetCsv).then(r=>r.text()).then(t=>{parse(t);try{localStorage.setItem('cham2',t)}catch(x){}render()}).catch(()=>{})}
function emb(u){if(!u)return'';let m=u.match(/tiktok\.com\/.*\/video\/(\d+)/);if(m)return`<iframe class="vid tk" src="https://www.tiktok.com/embed/v2/${m[1]}" allowfullscreen loading="lazy"></iframe>`;
 m=u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);if(m)return`<iframe class="vid yt" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`;
 return/^https?:\/\//.test(u)?`<a class="btn g" href="${e(u)}" target="_blank" rel="noopener">Xem liên kết ↗</a>`:''}
const pc=x=>`<div class="post"><b>${e(x.title)}</b>${x.ts?` <span class="mu">· ${new Date(x.ts).toLocaleDateString('vi-VN')}</span>`:''}<p>${e(x.body)}</p>${emb(x.link)}</div>`;
const pl=(s,f)=>S.filter(x=>x.sec==s).sort((a,b)=>(b.ts-a.ts)||(b.i-a.i)).map(f||pc).join('');
const ST=[['🔭','Biết trước'],['👀','Nhận diện sớm'],['🛠️','Xử lý đúng'],['🆘','Tìm kiếm hỗ trợ']];
const pt=x=>{const L=x.body.split(/\n+/).filter(Boolean);return`<div class="card"><h3>🎬 ${e(x.title)}</h3>${emb(x.link)}${L.length>=4?'<div class="steps">'+ST.map((s,i)=>`<div class="step"><b>${s[0]} ${s[1]}</b>${e(L[i])}</div>`).join('')+'</div>':`<p>${e(x.body)}</p>`}</div>`};
/* ---------- biểu mẫu ---------- */
const FD={
 tamsu:{t:'💌 Hộp thư tâm sự ẩn danh',code:1,f:[['khoi','Khối lớp','sel',['Khối 10','Khối 11','Khối 12']],['van_de','Vấn đề','sel',['Áp lực học tập','Mâu thuẫn bạn bè','Gia đình','Tình cảm tuổi học trò','Khác']],['noi_dung','Điều bạn muốn chia sẻ','txt']]},
 report:{t:'🚨 Hộp thư “Cảnh báo Xanh”',f:[['loai','Loại việc','sel',['Bắt nạt / cô lập','Đánh nhau','Đe dọa, trấn lột','Bạo lực mạng','Khác']],['lop','Lớp / địa điểm (không bắt buộc)','in'],['noi_dung','Mô tả sự việc','txt']]},
 booking:{t:'📅 Đăng ký lịch tư vấn',f:[['ho_ten','Họ tên & lớp','in'],['lien_he','Zalo / SĐT để thầy cô liên hệ','in'],['hinh_thuc','Hình thức','sel',['Gặp trực tiếp','Tư vấn online']],['noi_dung','Nội dung / thời gian mong muốn','txt']]}};
function form(k){const E=(C.embeds||{})[k];if(E)return`<iframe class="emb" src="${e(E)}" loading="lazy"></iframe>`;
 const F=(C.forms||{})[k];if(!F||!F.action)return'<div class="ok">Biểu mẫu chưa được cấu hình. Em hãy gặp trực tiếp thầy cô Tổ Tư vấn nhé.</div>';
 return FD[k].f.map(f=>`<label class="lb">${f[1]}</label>`+(f[2]=='sel'?`<select id="${k}_${f[0]}">${f[3].map(o=>`<option>${o}</option>`).join('')}</select>`:f[2]=='txt'?`<textarea id="${k}_${f[0]}" rows="4"></textarea>`:`<input id="${k}_${f[0]}">`)).join('')+`<button class="btn" data-send="${k}">Gửi</button><div id="msg_${k}"></div>`}
async function send(k){const F=C.forms[k],d=FD[k],m=$('#msg_'+k),p=new URLSearchParams();
 if(!$('#'+k+'_noi_dung').value.trim()){m.innerHTML='<div class="ok">Bạn chưa nhập nội dung.</div>';return}
 let code='';if(d.code){const L=()=>String.fromCharCode(65+Math.random()*26|0);code='NCT-'+(1000+Math.floor(Math.random()*9000))+L()+L()}
 d.f.forEach(f=>{if(F.fields&&F.fields[f[0]])p.append(F.fields[f[0]],$('#'+k+'_'+f[0]).value)});if(code&&F.fields&&F.fields.ma)p.append(F.fields.ma,code);
 m.innerHTML='<div class="ok">Đang gửi…</div>';
 try{await fetch(F.action,{method:'POST',mode:'no-cors',body:p});d.f.forEach(f=>{if(f[2]!='sel')$('#'+k+'_'+f[0]).value=''});
  m.innerHTML='<div class="ok">✅ Đã gửi. Cảm ơn bạn!'+(code?`<br>Mã tra cứu của bạn: <b style="font-size:1.2rem">${code}</b><br>Hãy <b>chụp màn hình / ghi lại mã</b>. Sau 12–24 giờ, nhập mã vào ô “Tra cứu phản hồi” để đọc thư trả lời.`:'')+'</div>'}
 catch(x){m.innerHTML='<div class="ok">Gửi chưa được, bạn kiểm tra mạng và thử lại nhé.</div>'}}
async function lookup(){const c=$('#lk').value.trim().toUpperCase(),o=$('#lkr');if(!c)return;if(!C.replyCsv){o.innerHTML='<div class="ok">Chức năng tra cứu chưa được cấu hình.</div>';return}
 try{const t=await(await fetch(C.replyCsv,{cache:'no-store'})).text();const r=csv(t).slice(1).find(r=>(r[0]||'').trim().toUpperCase()==c);
  o.innerHTML=r&&r[1]?`<div class="ok"><b>Thư trả lời của thầy cô${r[2]?' ('+e(r[2])+')':''}:</b><p style="white-space:pre-wrap;margin:6px 0 0">${e(r[1])}</p></div>`:'<div class="ok">Chưa có phản hồi cho mã này. Bạn quay lại sau 12–24 giờ nhé.</div>'}catch(x){o.innerHTML='<div class="ok">Không tra cứu được, vui lòng thử lại.</div>'}}
const HOT='<div class="ok">🆘 Cần giúp ngay? Gọi <b>111</b> (Tổng đài quốc gia bảo vệ trẻ em, miễn phí 24/7) hoặc nói với thầy cô / người lớn bạn tin tưởng. Bạn không một mình.</div>';
/* ---------- chatbot ---------- */
const BOT={baoluc:['🚨 Mình muốn báo cáo bạo lực học đường','Nhà trường luôn bảo vệ em! Nếu em bị bắt nạt, bị cô lập hoặc bị công kích trên mạng, hãy dùng <b>Hộp thư “Cảnh báo Xanh”</b> ở mục An toàn học đường.','m3:report','Mở Cảnh báo Xanh'],
 apluc:['📚 Mình đang áp lực điểm số và việc học','Hít một hơi thật sâu nào! Rất nhiều bạn cũng đang như em. Hãy thử <b>làm bài kiểm tra căng thẳng (DASS-21)</b> hoặc gửi tâm sự để thầy cô gỡ rối cùng em.','m4:q_dass','Làm bài DASS-21'],
 tamsu:['💌 Mình muốn gửi tâm sự giấu tên','Tụi mình luôn lắng nghe! Hộp thư tâm sự <b>không hỏi tên hay email</b>, em sẽ nhận một mã bí mật để đọc thư trả lời.','m2:tamsu','Mở Hộp thư tâm sự'],
 tn:['🧭 Mình muốn làm trắc nghiệm tâm lý','Tuyệt vời! Có 3 bài: căng thẳng (DASS-21), điểm mạnh tính cách và EQ, kèm lý giải và lời khuyên.','m4','Đến Trắc nghiệm'],
 gap:['👩‍🏫 Mình muốn đặt lịch gặp thầy cô','Các thầy cô Tổ Tư vấn luôn đón chờ em! Em chọn gặp trực tiếp hoặc online ở mục Phòng Tư vấn nhé.','m2:booking','Đặt lịch hẹn']};
const cm=(t,u)=>{const d=document.createElement('div');d.className=u?'um':'bm';d.innerHTML=t;$('#cb').appendChild(d);$('#cb').scrollTop=1e5};
function chat(t){const b=BOT[t];cm(b[0],1);setTimeout(()=>cm(b[1]+`<br><br><a class="btn g" href="#" data-go="${b[2]}">${b[3]}</a>`),300)}
function chatTxt(){const i=$('#cu'),m=i.value.trim();if(!m)return;cm(e(m),1);i.value='';
 setTimeout(()=>cm(/tự tử|tự sát|muốn chết|tự làm đau|tự hại|không muốn sống/i.test(m)?'Mình rất lo cho em và mình muốn em được an toàn. Hãy nói ngay với thầy cô hoặc người lớn em tin tưởng, hoặc gọi <b>111</b> (miễn phí 24/7). Em không một mình. 💛':'Cảm ơn em đã chia sẻ! 🌿 Lưu ý: khung chat này chỉ trả lời tự động, <b>tin nhắn chưa được gửi tới thầy cô</b>. Em hãy gửi vào <a href="#" data-go="m2:tamsu">Hộp thư tâm sự</a> để nhận thư trả lời nhé.'),400)}
/* ---------- trắc nghiệm ---------- */
const DQ=['Tôi thấy khó thư giãn','Tôi bị khô miệng','Tôi không cảm nhận được cảm xúc tích cực nào','Tôi bị khó thở dù không gắng sức','Tôi thấy khó bắt tay vào làm việc','Tôi có xu hướng phản ứng thái quá','Tôi bị run tay chân','Tôi thấy mình tiêu hao nhiều năng lượng vì căng thẳng','Tôi lo lắng về các tình huống có thể khiến mình hoảng sợ hoặc xấu hổ','Tôi thấy mình không có gì để mong đợi','Tôi dễ bị kích động','Tôi thấy khó thư giãn được','Tôi thấy buồn chán, nản lòng','Tôi không chịu được việc bị cản trở','Tôi thấy mình gần như hoảng loạn','Tôi không thể hứng thú với bất cứ điều gì','Tôi thấy mình chẳng có giá trị gì','Tôi khá dễ phật ý, tự ái','Tôi nghe rõ tim đập dù không gắng sức','Tôi thấy sợ vô cớ','Tôi thấy cuộc sống vô nghĩa'];
const VIA=`Sáng tạo|Tôi hay nghĩ ra cách làm mới mẻ|Ghi lại ý tưởng và thử biến nó thành một dự án nhỏ
Tò mò|Tôi thích khám phá những điều chưa biết|Mỗi tuần đặt một câu hỏi “tại sao?” và tìm hiểu thêm
Tư duy phản biện|Tôi cân nhắc nhiều phía trước khi kết luận|Giúp bạn bè phân tích vấn đề, nhưng cũng lắng nghe cảm xúc của họ
