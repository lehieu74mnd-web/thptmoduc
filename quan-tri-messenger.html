<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Trang quản trị tư vấn - THPT Mộ Đức</title>
<style>
body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;background:#f4f6f9;margin:0;padding:20px}
.container{max-width:800px;margin:0 auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
h2{color:#3D405B;border-bottom:2px solid #E07A5F;padding-bottom:10px}
.chat-card{border:1px solid #e0e0e0;border-radius:8px;padding:15px;margin-bottom:15px;background:#fafafa}
.student-msg{color:#2b2d42;margin-bottom:10px;white-space:pre-wrap}
.teacher-reply{background:#e8f5e9;padding:8px 12px;border-radius:6px;font-size:.9rem;color:#2e7d32;margin-top:8px;white-space:pre-wrap}
.reply-box{display:flex;gap:10px;margin-top:10px}
.reply-box input{flex:1;padding:8px;border:1px solid #ccc;border-radius:5px}
button{background:#3D405B;color:#fff;border:0;padding:8px 16px;border-radius:5px;cursor:pointer;font-weight:700}button:hover{background:#E07A5F}
.status-badge{font-size:.75rem;padding:3px 8px;border-radius:12px;color:#fff;display:inline-block;margin-bottom:8px}
.bg-pending{background:#e67e22}.bg-done{background:#27ae60}.mu{color:#777;font-size:.85rem}
</style>
</head>
<body>
<div class="container">
  <h2>Hệ thống tiếp nhận &amp; Trả lời tư vấn học đường</h2>
  <div id="auth"></div>
  <div id="message-list"></div>
</div>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,onSnapshot,doc,updateDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp(window.CFG.firebase),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=d=>{if(d.timestamp&&d.timestamp.toMillis)return d.timestamp.toMillis();const m=String(d.thoiGian||'').match(/(\d+):(\d+):(\d+)\s+(\d+)\/(\d+)\/(\d+)/);return m?new Date(+m[6],m[5]-1,+m[4],+m[1],+m[2],+m[3]).getTime():0};
let unsub=null;

onAuthStateChanged(auth,u=>{
  if(unsub){unsub();unsub=null}
  $('message-list').innerHTML='';
  if(!u||u.isAnonymous){
    $('auth').innerHTML='<p class="mu">Đăng nhập bằng tài khoản Google của giáo viên được cấp quyền.</p><button id="in">Đăng nhập bằng Google</button>';
    $('in').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert('Không đăng nhập được: '+(e.code||e.message)));
    return;
  }
  $('auth').innerHTML='<p class="mu">'+esc(u.email)+' · <a href="#" id="out">Đăng xuất</a></p>';
  $('out').onclick=e=>{e.preventDefault();signOut(auth)};
  $('message-list').textContent='Đang tải danh sách câu hỏi...';
  unsub=onSnapshot(collection(db,'Messenger'),snap=>{
    const list=$('message-list');
    if(snap.empty){list.innerHTML='<p>Chưa có câu hỏi nào từ học sinh.</p>';return}
    const rows=snap.docs.map(d=>({id:d.id,d:d.data()})).sort((a,b)=>when(b.d)-when(a.d));
    list.innerHTML=rows.map(({id,d})=>{const done=d.trangThai==='da_tra_loi';
      return `<div class="chat-card"><span class="status-badge ${done?'bg-done':'bg-pending'}">${done?'Đã phản hồi':'Chờ phản hồi'}</span> <span class="mu">${esc(d.thoiGian||'')}</span>
      <div class="student-msg"><b>Học sinh:</b> ${esc(d.noiDung)}</div>
      ${d.traLoiGV?`<div class="teacher-reply"><b>Câu trả lời hiện tại:</b> ${esc(d.traLoiGV)}</div>`:''}
      <div class="reply-box"><input type="text" data-in="${esc(id)}" placeholder="Nhập câu trả lời của thầy/cô..."><button data-id="${esc(id)}">Gửi trả lời</button></div></div>`}).join('');
    rows.forEach(({id,d})=>{const i=list.querySelector(`input[data-in="${CSS.escape(id)}"]`);if(i)i.value=d.traLoiGV||''});
    list.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.id,v=list.querySelector(`input[data-in="${CSS.escape(id)}"]`).value.trim();
      if(!v){alert('Vui lòng nhập nội dung trả lời!');return}
      try{await updateDoc(doc(db,'Messenger',id),{traLoiGV:v,trangThai:'da_tra_loi'});alert('Đã gửi phản hồi tới học sinh!')}
      catch(e){console.error(e);alert('Không thể gửi phản hồi: '+(e.code||e.message))}});
  },err=>{$('message-list').innerHTML='<p>Tài khoản này chưa có quyền xem tin nhắn ('+esc(err.code)+'). Hãy nhờ quản trị thêm email vào quy tắc Firestore.</p>'});
});
</script>
</body>
</html>
